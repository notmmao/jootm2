# jootm2-server configuration
# HTTP admin + WebSocket game share a single NIO port.

# Listen port for HTTP (admin) and WebSocket (game)
server.port=8080

# Number of NIO selector (reactor) threads. Each thread multiplexes thousands of
# connections with a single java.nio.channels.Selector (io multiplexing).
server.ioThreads=2

# Acceptor backlog
server.backlog=256

# SQLite database file (relative to working directory)
db.file=data/jootm2.db

# Game tick interval in milliseconds (movement/monster/combat updates)
game.tickMs=100

# Save player data to SQLite every N seconds
game.savePeriodSec=30

# Web content root (frontend static files, relative to working directory)
web.root=frontend

# Legend of Mir resource root (Data/Map/Wav/resources.json, relative to working directory)
resources.root=resources

# URL prefix used to serve resources
resources.prefix=/resources

# Server game data root (mud2/DB CSV templates -> SQLite on first boot)
gamedata.root=gamedata

# Database website root, served at /site (gen_website.py --out)
website.root=data/website

# Game world defaults used when no map data exists yet
world.width=200
world.height=200
world.playerSpawnX=100
world.playerSpawnY=100
# PK point decay interval in seconds (online only). Vanilla=120 (2min/point),
# default 15 here per user request 2026-11-22. Yellow name 100pt / red 200pt.
pk.decayIntervalSec=15

# ---- Offline AFK (离线修炼) run log ----
# JSONL, one event per line. Path: <dir>/<YYYY-MM-DD>_<character>.jsonl
# Analyse with: python scripts/afk_log_report.py [--day YYYY-MM-DD] [--name X]
# Set logEnabled=0 to turn the whole thing off.
afk.logEnabled=1
afk.logDir=data/afk-logs
# Sample every N minutes (0 = only key events, no per-minute samples)
afk.logSampleMinutes=1

# ---- 精英怪（用户新增，原版无）----
elite.rate=0.05
elite.hpMult=2.0
elite.dcMult=1.5
elite.expMult=3.0
elite.dropMult=5.0
