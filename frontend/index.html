<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>传奇 MIR2</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;           /* 全局禁文本/元素框选（按住移动时避免选中） */
            -webkit-user-select: none;
        }
        /* 输入框仍可正常输入选择文本（游戏仅登录/注册/聊天输入） */
        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }
        #stage {
            position: relative;
            /* flex 容器会默认压缩子项：窗口小于 800 时布局宽被压到 640，再叠加
               scale 就会变成 512×480（比例失真）。必须禁止收缩。 */
            flex: none;
            width: 800px;
            height: 600px;
            /* 内部逻辑坐标恒为 800×600；由 main.mjs 按窗口等比 scale */
            transform-origin: center center;
            will-change: transform;
        }
        /* 移动端触屏：禁长按选择/高亮与页面回弹；画布与摇杆各自 touch-action:none */
        body.touch { -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; overscroll-behavior: none; }
        body.touch #screen, body.touch #touch-ui { touch-action: none; }
        body.touch #gui { touch-action: pan-y; }   /* 背包等窗口内仍可滚动 */
        #rotate-tip { display: none; }
        @media (orientation: portrait) and (pointer: coarse) and (max-width: 820px) {
            body.touch #rotate-tip {
                display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 80;
                height: 34px; align-items: center; justify-content: center;
                background: rgba(12, 16, 24, .88); color: #ffe6a8;
                font: 13px SimSun, serif; letter-spacing: 1px;
                padding-top: env(safe-area-inset-top, 0);
            }
        }
        /* 游戏场景层（canvas 轮询绘制） */
        #screen {
            position: absolute;
            left: 0;
            top: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* GUI 层（DOM 多窗体，覆盖在 canvas 上） */
        #gui {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 600px;
            pointer-events: none;   /* 容器不拦截，由控件自身 div 拦截 */
        }
        #gui .d-control {
            pointer-events: auto;   /* 控件自身可交互 */
            box-sizing: border-box;
        }
        /* 启动加载层：内联在 HTML 里，JS 还没下载完就能看到，不会黑屏干等 */
        #boot-layer {
            position: absolute;
            left: 0; top: 0;
            width: 800px; height: 600px;
            z-index: 50;
            background: radial-gradient(ellipse at 50% 42%, #1c1610 0%, #0a0806 72%);
            color: #d9c48a;
            font-family: SimSun, "宋体", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .45s ease;
        }
        #boot-layer.done { opacity: 0; pointer-events: none; }
        #boot-title {
            font-size: 38px;
            letter-spacing: 14px;
            text-indent: 14px;
            color: #e8cf90;
            text-shadow: 0 0 18px rgba(220, 170, 70, .45), 0 2px 0 #000;
            margin-bottom: 6px;
        }
        #boot-sub {
            font-size: 13px;
            letter-spacing: 5px;
            text-indent: 5px;
            color: #8a7854;
            margin-bottom: 46px;
        }
        #boot-bar {
            width: 420px; height: 14px;
            border: 1px solid #6b5a35;
            background: #16110b;
            box-shadow: inset 0 0 6px #000;
            padding: 2px;
            box-sizing: border-box;
        }
        #boot-fill {
            width: 0%; height: 100%;
            background: linear-gradient(180deg, #f0d68c 0%, #c9973c 55%, #8a6220 100%);
            transition: width .18s ease;
        }
        #boot-line {
            width: 420px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a89570;
            margin-top: 9px;
        }
        #boot-layer.error #boot-status { color: #ff6b5e; }
        #boot-tip {
            margin-top: 54px;
            font-size: 11px;
            color: #5e5340;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="rotate-tip">↻ 横屏体验更佳 · 请旋转设备</div>
    <div id="stage">
        <canvas id="screen" width="800" height="600"></canvas>
        <div id="gui"></div>
        <div id="boot-layer">
            <div id="boot-title">传奇 MIR2</div>
            <div id="boot-sub">LEGEND OF MIR · 1.80</div>
            <div id="boot-bar"><div id="boot-fill"></div></div>
            <div id="boot-line">
                <span id="boot-status">正在连接服务器…</span>
                <span id="boot-pct">0%</span>
            </div>
            <div id="boot-tip">首次加载需下载客户端素材，之后自动使用本地缓存</div>
        </div>
    </div>
    <script type="module" src="./main.mjs"></script>
</body>
</html>
